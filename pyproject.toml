[project]
name = "homecontrol"
version = "0.1.0"
description = "Central home control and security app built on Home Assistant, Frigate and MQTT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "aiomqtt>=2.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
homecontrol = "homecontrol.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homecontrol = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
